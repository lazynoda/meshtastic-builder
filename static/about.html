<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meshtastic Builder</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="app-header">
        <a class="logo" href="/">
          <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="14" cy="14" r="3" fill="currentColor" />
            <circle cx="6" cy="6" r="2" fill="currentColor" opacity=".6" />
            <circle cx="22" cy="6" r="2" fill="currentColor" opacity=".6" />
            <circle cx="6" cy="22" r="2" fill="currentColor" opacity=".4" />
            <circle cx="22" cy="22" r="2" fill="currentColor" opacity=".4" />
            <line x1="14" y1="14" x2="6" y2="6" stroke="currentColor" stroke-width="1" opacity=".5" />
            <line x1="14" y1="14" x2="22" y2="6" stroke="currentColor" stroke-width="1" opacity=".5" />
            <line x1="14" y1="14" x2="6" y2="22" stroke="currentColor" stroke-width="1" opacity=".3" />
            <line x1="14" y1="14" x2="22" y2="22" stroke="currentColor" stroke-width="1" opacity=".3" />
          </svg>
          <span>Meshtastic <em>/ Firmware builder</em></span>
        </a>
        <div class="header-right">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-button" data-lang="es">ES</button>
            <button type="button" class="lang-button" data-lang="en">EN</button>
          </div>
          <a class="btn" href="/" data-i18n="nav.builder"></a>
        </div>
      </header>

      <main class="app-main prose">
        <h1 data-i18n="about.title"></h1>

        <section>
          <h2 data-i18n="about.whatTitle"></h2>
          <p data-i18n="about.what"></p>
        </section>

        <section>
          <h2 data-i18n="about.whereTitle"></h2>
          <p data-i18n-html="about.where"></p>
        </section>

        <section>
          <h2 data-i18n="about.retentionTitle"></h2>
          <!-- The retention window is a server setting, so read it from the API
               instead of repeating a number that can drift out of date. -->
          <p id="aboutRetention"></p>
        </section>

        <section>
          <h2 data-i18n="about.firmwareTitle"></h2>
          <p data-i18n-html="about.firmware"></p>
          <!-- One entry per patch the builder can apply. Keep this list and
               data/build_options.json in step: a patch that is not described
               here is a change to someone's radio that nobody announced. -->
          <ol class="mod-list">
            <li>
              <h3 data-i18n="about.mod1Title"></h3>
              <p data-i18n-html="about.mod1"></p>
            </li>
            <li>
              <h3 data-i18n="about.mod2Title"></h3>
              <p data-i18n-html="about.mod2"></p>
            </li>
          </ol>
          <p data-i18n-html="about.firmwareClosing"></p>
          <p data-i18n="about.comingSoon"></p>
        </section>

        <section class="section-warn">
          <h2>
            <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3.8 2.6 20h18.8L12 3.8Z" />
              <path d="M12 10v4" />
              <path d="M12 17.3v.6" />
            </svg>
            <span data-i18n="about.trustTitle"></span>
          </h2>
          <p data-i18n="about.trust"></p>
          <p data-i18n-html="about.diy"></p>
        </section>
      </main>

      <footer class="app-footer">
        <p data-i18n="footer.trademark"></p>
      </footer>
    </div>
    <script src="/static/i18n.js"></script>
    <script>
      let retentionDays = null;

      function render() {
        applyI18n();
        document.title = `${t("about.title")} · Meshtastic Builder`;
        if (retentionDays) {
          document.getElementById("aboutRetention").textContent = t("about.retention", {
            days: retentionDays,
          });
        }
      }

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => setLang(button.dataset.lang));
      });
      document.addEventListener("languagechange", render);

      render();

      fetch("/api/build-options")
        .then((response) => (response.ok ? response.json() : null))
        .then((options) => {
          retentionDays = options?.artifactTtlDays ?? null;
          render();
        })
        .catch(() => {});
    </script>
  </body>
</html>
