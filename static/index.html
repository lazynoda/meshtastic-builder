<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meshtastic Builder</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="app-header">
        <div class="logo">
          <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="14" cy="14" r="3" fill="currentColor" />
            <circle cx="6" cy="6" r="2" fill="currentColor" opacity=".6" />
            <circle cx="22" cy="6" r="2" fill="currentColor" opacity=".6" />
            <circle cx="6" cy="22" r="2" fill="currentColor" opacity=".4" />
            <circle cx="22" cy="22" r="2" fill="currentColor" opacity=".4" />
            <line x1="14" y1="14" x2="6" y2="6" stroke="currentColor" stroke-width="1" opacity=".5" />
            <line x1="14" y1="14" x2="22" y2="6" stroke="currentColor" stroke-width="1" opacity=".5" />
            <line x1="14" y1="14" x2="6" y2="22" stroke="currentColor" stroke-width="1" opacity=".3" />
            <line x1="14" y1="14" x2="22" y2="22" stroke="currentColor" stroke-width="1" opacity=".3" />
          </svg>
          <span>Meshtastic <em>/ Firmware builder</em></span>
        </div>
        <div class="header-right">
          <span class="tagline" data-i18n="header.tagline"></span>
          <a class="header-link" href="/about" data-i18n="nav.about"></a>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-button" data-lang="es">ES</button>
            <button type="button" class="lang-button" data-lang="en">EN</button>
          </div>
          <button id="refreshVersions" class="btn" type="button" data-i18n="header.refresh"></button>
        </div>
      </header>

      <main class="app-main">
        <form id="buildForm">
          <section class="panel">
            <h2><span data-i18n="step1.title"></span></h2>
            <div class="grid grid-two">
              <label>
                <span data-i18n="step1.device"></span>
                <div id="deviceCombo"></div>
              </label>
              <label>
                <span data-i18n="step1.version"></span>
                <select id="firmwareTag" name="firmwareTag" required></select>
              </label>
            </div>
          </section>

          <section class="panel">
            <h2><span data-i18n="step2.title"></span></h2>
            <div class="grid grid-two">
              <label>
                <span data-i18n="step2.longName"></span>
                <input id="longName" type="text" autocomplete="off" value="Mi nodo Meshtastic">
              </label>
              <label>
                <span data-i18n="step2.shortName"></span>
                <span class="inline-input">
                  <input id="shortName" type="text" autocomplete="off" value="MESH" aria-describedby="shortNameBytes">
                  <span id="shortNameBytes" class="byte-counter">4/4 bytes</span>
                </span>
              </label>
              <label class="span-two">
                <span data-i18n="step5.tz"></span>
                <span class="inline-input">
                  <input id="tzString" type="text" value="CET-1CEST,M3.5.0,M10.5.0/3" autocomplete="off">
                  <button class="btn btn-mini" type="button" data-tz="CET-1CEST,M3.5.0,M10.5.0/3" data-i18n="step5.tzPeninsula"></button>
                  <button class="btn btn-mini" type="button" data-tz="WET0WEST,M3.5.0/1,M10.5.0" data-i18n="step5.tzCanarias"></button>
                </span>
              </label>
            </div>
          </section>

          <section class="panel">
            <h2><span data-i18n="step3.title"></span></h2>
            <div class="grid grid-three">
              <label>
                <span data-i18n="step3.region"></span>
                <select id="loraRegion"></select>
              </label>
              <label>
                <span data-i18n="step3.preset"></span>
                <select id="modemPreset"></select>
                <small id="presetDisabledHint" class="field-hint" data-i18n="step3.presetDisabled" hidden></small>
              </label>
              <label data-pref-key="USERPREFS_LORACONFIG_TX_POWER">
                <span data-i18n="step3.txPower"></span>
                <input id="loraTxPower" type="number" min="0" max="30" placeholder="0">
                <small class="field-hint" data-i18n="step3.txPowerHint"></small>
              </label>
            </div>
            <h3 class="sub-head" data-i18n="step3.mqttHead"></h3>
            <div class="grid grid-two">
              <label class="check-line" data-pref-key="USERPREFS_CONFIG_LORA_IGNORE_MQTT">
                <input id="ignoreMqtt" type="checkbox">
                <span data-i18n="step3.ignoreMqtt"></span>
                <small class="field-hint" data-i18n="step3.ignoreMqttHint"></small>
              </label>
              <label class="check-line code-option">
                <input id="okToMqtt" type="checkbox" checked>
                <span data-i18n="step6.okToMqtt"></span>
                <span class="badge patch-only" data-i18n="step6.badge"></span>
                <small class="field-hint" data-i18n="step3.okToMqttHint"></small>
              </label>
            </div>
            <p id="advancedUnavailable" class="status-line status-warn" data-i18n="step6.unavailable" hidden></p>
            <div class="code-option">
              <label class="check-line">
                <input id="customLoraEnabled" type="checkbox" checked>
                <span data-i18n="step6.customLora"></span>
                <span class="badge patch-only" data-i18n="step6.badge"></span>
              </label>
              <div id="customLoraFields" hidden>
                <p class="status-line status-warn patch-only" data-i18n="step6.warning"></p>
                <p class="status-line" data-i18n="step6.customLoraHint"></p>
                <div class="grid grid-three">
                  <label>
                    <span data-i18n="step6.bandwidth"></span>
                    <select id="loraBandwidth"></select>
                  </label>
                  <label>
                    <span data-i18n="step6.spreadFactor"></span>
                    <select id="loraSpreadFactor"></select>
                  </label>
                  <label>
                    <span data-i18n="step6.codingRate"></span>
                    <select id="loraCodingRate"></select>
                  </label>
                  <label>
                    <span data-i18n="step6.channelNum"></span>
                    <input id="loraChannelNum" type="number" min="0" max="255" value="0">
                    <small class="field-hint" data-i18n="step6.channelNumHint"></small>
                  </label>
                  <label>
                    <span data-i18n="step6.overrideFreq"></span>
                    <input id="loraOverrideFreq" type="number" min="0" max="1000" step="0.001" value="0">
                    <small class="field-hint" data-i18n="step6.overrideFreqHint"></small>
                  </label>
                </div>
              </div>
            </div>
          </section>

          <section class="panel">
            <h2><span data-i18n="behaviour.title"></span></h2>
            <p class="status-line" data-i18n="behaviour.hint"></p>
            <div class="grid grid-two">
              <label>
                <span data-i18n="step3.role"></span>
                <select id="deviceRole"></select>
              </label>
              <label data-pref-key="USERPREFS_CONFIG_DEVICE_REBROADCAST_MODE">
                <span data-i18n="behaviour.rebroadcast"></span>
                <select id="rebroadcastMode"></select>
              </label>
              <label data-pref-key="USERPREFS_CONFIG_DEVICE_NODE_INFO_BROADCAST_SECS">
                <span data-i18n="behaviour.nodeInfoSecs"></span>
                <input id="nodeInfoSecs" type="number" min="3600" step="3600" value="259200">
                <small class="field-hint" data-i18n="behaviour.nodeInfoHint"></small>
              </label>
              <label data-pref-key="USERPREFS_CONFIG_DEVICE_TELEM_UPDATE_INTERVAL">
                <span data-i18n="behaviour.deviceTelem"></span>
                <input id="deviceTelemInterval" type="number" min="0" step="60" placeholder="900">
                <small class="field-hint" data-i18n="behaviour.telemHint"></small>
              </label>
            </div>
          </section>

          <section class="panel">
            <h2>
              <span data-i18n="step4.title"></span>
              <button id="addChannel" class="btn btn-mini" type="button" data-i18n="step4.add"></button>
            </h2>
            <p id="channelHint" class="status-line"></p>
            <div id="channelRows"></div>
          </section>


          <details class="collapsible">
            <summary>
              <span data-i18n="radios.title"></span>
              <small class="field-hint" data-i18n="radios.hint"></small>
            </summary>

            <section class="panel">
              <h2><span data-i18n="radios.bluetoothHead"></span></h2>
              <div class="grid grid-two">
                <label class="check-line" data-pref-key="USERPREFS_FIXED_BLUETOOTH">
                  <input id="blePinEnabled" type="checkbox">
                  <span data-i18n="radios.blePinEnabled"></span>
                  <small class="field-hint" data-i18n="radios.blePinHint"></small>
                </label>
                <label data-pref-key="USERPREFS_FIXED_BLUETOOTH">
                  <span data-i18n="radios.blePin"></span>
                  <input id="blePin" type="number" min="0" max="999999" step="1" value="121212">
                </label>
              </div>
            </section>

            <section id="wifiPanel" class="panel">
              <h2><span data-i18n="radios.wifiHead"></span></h2>
              <p id="wifiUnsupported" class="status-line status-warn" data-i18n="radios.wifiUnsupported" hidden></p>
              <label class="check-line" data-pref-key="USERPREFS_NETWORK_WIFI_ENABLED">
                <input id="wifiEnabled" type="checkbox">
                <span data-i18n="radios.wifiEnabled"></span>
                <small class="field-hint" data-i18n="radios.wifiHint"></small>
              </label>
              <div class="grid grid-three">
                <label data-pref-key="USERPREFS_NETWORK_WIFI_SSID">
                  <span data-i18n="radios.wifiSsid"></span>
                  <input id="wifiSsid" type="text" autocomplete="off" maxlength="32">
                </label>
                <label data-pref-key="USERPREFS_NETWORK_WIFI_PSK">
                  <span data-i18n="radios.wifiPsk"></span>
                  <input id="wifiPsk" type="text" autocomplete="off" maxlength="64">
                  <small class="field-hint" data-i18n="radios.wifiPskHint"></small>
                </label>
              </div>
            </section>
          </details>

          <details class="collapsible">
            <summary>
              <span data-i18n="step5.mqttHead"></span>
              <small class="field-hint" data-i18n="mqtt.hint"></small>
            </summary>

            <section class="panel">
              <h2><span data-i18n="step5.mqttHead"></span></h2>
              <div class="grid grid-three">
                <label>
                  <span data-i18n="step5.mqttAddress"></span>
                  <input id="mqttAddress" type="text" value="mqtt.meshtastic.es" autocomplete="off">
                </label>
                <label data-pref-key="USERPREFS_MQTT_USERNAME">
                  <span data-i18n="step5.mqttUsername"></span>
                  <input id="mqttUsername" type="text" autocomplete="off" value="meshdev">
                </label>
                <label data-pref-key="USERPREFS_MQTT_PASSWORD">
                  <span data-i18n="step5.mqttPassword"></span>
                  <input id="mqttPassword" type="text" autocomplete="off" value="large4cats">
                  <small class="field-hint" data-i18n="step5.mqttPasswordHint"></small>
                </label>
                <label data-pref-key="USERPREFS_MQTT_ROOT_TOPIC">
                  <span data-i18n="step5.mqttRoot"></span>
                  <input id="mqttRootTopic" type="text" autocomplete="off" placeholder="msh/EU_868">
                </label>
                <label class="check-line">
                  <input id="mqttEnabled" type="checkbox">
                  <span data-i18n="step5.mqttEnabled"></span>
                </label>
                <label class="check-line" data-pref-key="USERPREFS_MQTT_ENCRYPTION_ENABLED">
                  <input id="mqttEncryption" type="checkbox" checked>
                  <span data-i18n="step5.mqttEncryption"></span>
                </label>
                <label class="check-line" data-pref-key="USERPREFS_MQTT_TLS_ENABLED">
                  <input id="mqttTls" type="checkbox">
                  <span data-i18n="step5.mqttTls"></span>
                </label>
              </div>
            </section>
          </details>

          <details class="collapsible">
            <summary>
              <span data-i18n="position.title"></span>
              <small class="field-hint" data-i18n="position.hint"></small>
            </summary>

            <section class="panel">
              <div class="grid grid-three">
                <label data-pref-key="USERPREFS_CONFIG_GPS_MODE">
                  <span data-i18n="position.gpsMode"></span>
                  <select id="gpsMode"></select>
                </label>
                <label data-pref-key="USERPREFS_CONFIG_GPS_UPDATE_INTERVAL">
                  <span data-i18n="position.gpsInterval"></span>
                  <input id="gpsUpdateInterval" type="number" min="0" step="30" placeholder="600">
                </label>
                <label data-pref-key="USERPREFS_CONFIG_POSITION_BROADCAST_INTERVAL">
                  <span data-i18n="position.broadcastInterval"></span>
                  <input id="positionBroadcastInterval" type="number" min="0" step="3600" value="259200">
                  <small class="field-hint" data-i18n="position.broadcastHint"></small>
                </label>
                <label class="check-line span-two" data-pref-key="USERPREFS_CONFIG_SMART_POSITION_ENABLED">
                  <input id="smartPosition" type="checkbox">
                  <span data-i18n="position.smart"></span>
                  <small class="field-hint" data-i18n="position.smartHint"></small>
                </label>
                <label class="check-line span-two" data-pref-key="USERPREFS_BLOCK_POSITION_ON_EVENT_CHANNEL">
                  <input id="blockPositionOnEvent" type="checkbox">
                  <span data-i18n="position.blockOnEvent"></span>
                  <small class="field-hint" data-i18n="position.blockOnEventHint"></small>
                </label>
              </div>

              <h3 class="sub-head" data-i18n="position.fixedHead"></h3>
              <label class="check-line" data-pref-key="USERPREFS_FIXED_GPS">
                <input id="fixedGpsEnabled" type="checkbox">
                <span data-i18n="position.fixedEnabled"></span>
                <small class="field-hint" data-i18n="position.fixedHint"></small>
              </label>
              <div id="fixedGpsFields" class="grid grid-three" hidden>
                <label data-pref-key="USERPREFS_FIXED_GPS_LAT">
                  <span data-i18n="position.lat"></span>
                  <input id="fixedGpsLat" type="text" inputmode="decimal" autocomplete="off" placeholder="41.3851">
                </label>
                <label data-pref-key="USERPREFS_FIXED_GPS_LON">
                  <span data-i18n="position.lon"></span>
                  <input id="fixedGpsLon" type="text" inputmode="decimal" autocomplete="off" placeholder="-3.7038">
                </label>
                <label data-pref-key="USERPREFS_FIXED_GPS_ALT">
                  <span data-i18n="position.alt"></span>
                  <input id="fixedGpsAlt" type="number" step="1" placeholder="0">
                </label>
              </div>
            </section>
          </details>

          <details class="collapsible">
            <summary>
              <span data-i18n="security.title"></span>
              <small class="field-hint" data-i18n="security.hint"></small>
            </summary>

            <section class="panel">
              <div class="grid">
                <label>
                  <span data-i18n="step5.adminKey"></span>
                  <input id="adminKey" type="text" autocomplete="off" placeholder="AQIDBA...">
                </label>
                <label data-pref-key="USERPREFS_USE_ADMIN_KEY_1">
                  <span data-i18n="step5.adminKey1"></span>
                  <input id="adminKey1" type="text" autocomplete="off" placeholder="AQIDBA...">
                </label>
                <label data-pref-key="USERPREFS_USE_ADMIN_KEY_2">
                  <span data-i18n="step5.adminKey2"></span>
                  <input id="adminKey2" type="text" autocomplete="off" placeholder="AQIDBA...">
                </label>
              </div>
              <div class="grid grid-two">
                <label data-pref-key="USERPREFS_CONFIG_SECURITY_PACKET_SIGNATURE_POLICY">
                  <span data-i18n="step5.signaturePolicy"></span>
                  <select id="signaturePolicy"></select>
                </label>
                <label class="check-line" data-pref-key="USERPREFS_CONFIG_SECURITY_IS_MANAGED">
                  <input id="securityIsManaged" type="checkbox" disabled>
                  <span data-i18n="step5.isManaged"></span>
                  <small id="isManagedHint" class="field-hint" data-i18n="step5.isManagedHint"></small>
                </label>
              </div>
            </section>
          </details>


          <details class="collapsible">
            <summary>
              <span data-i18n="extra.title"></span>
              <small class="field-hint" data-i18n="extra.hint"></small>
            </summary>

            <section class="panel">
              <p class="status-line" data-i18n="extra.help"></p>
              <div id="extraRows"></div>
              <button id="addExtraPref" class="btn btn-mini" type="button" data-i18n="extra.add"></button>
            </section>
          </details>

          <section class="panel">
            <h2><span data-i18n="step7.title"></span></h2>
            <details class="json-preview">
              <summary data-i18n="step7.preview"></summary>
              <textarea id="prefsJsonc" name="prefsJsonc" spellcheck="false" readonly></textarea>
            </details>
            <div class="submit-row">
              <div>
                <p class="status-line" data-i18n="step7.noEmail"></p>
                <p id="submitTtl" class="status-line"></p>
              </div>
              <div class="submit-cell">
                <button id="submitBuild" class="btn btn-primary" type="submit" data-i18n="step7.submit"></button>
              </div>
            </div>
            <p id="statusText" class="status-line" role="status"></p>
          </section>
        </form>

        <section id="result" class="panel" hidden>
          <h2><span id="resultTitle" data-i18n="result.title"></span></h2>
          <p id="resultKeep" class="status-line" data-i18n="result.keep"></p>
          <div class="result-url">
            <a id="buildUrl" href="#"></a>
            <button id="copyBuildUrl" class="btn btn-mini" type="button" data-i18n="result.copy"></button>
          </div>
          <dl class="result-list">
            <div><dt data-i18n="result.status"></dt><dd id="buildStatus" class="build-status"></dd></div>
            <div><dt data-i18n="result.node"></dt><dd id="buildNode"></dd></div>
            <div><dt data-i18n="result.shortName"></dt><dd id="buildShortName"></dd></div>
            <div><dt data-i18n="result.device"></dt><dd id="buildDevice"></dd></div>
            <div><dt data-i18n="result.firmware"></dt><dd id="buildFirmware"></dd></div>
            <div><dt data-i18n="result.download"></dt><dd><a id="downloadLink" href="#"></a></dd></div>
          </dl>
          <p id="resultTtl" class="status-line"></p>
        </section>
      </main>

      <footer class="app-footer">
        <p data-i18n="footer.trademark"></p>
      </footer>
    </div>
    <script src="/static/i18n.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
